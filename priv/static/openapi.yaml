openapi: 3.0.3
info:
  title: AgentYard API
  version: 0.1.0
  description: REST and SSE endpoints for self-hosted coding-agent runs.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/repositories:
    get:
      summary: List repositories available to the caller's team
      responses:
        "200":
          description: Repository list
  /api/runs:
    get:
      summary: List team runs
      responses:
        "200":
          description: Run list
    post:
      summary: Create and start a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRun"
      responses:
        "202":
          description: Run accepted
  /api/runs/{id}:
    get:
      summary: Get a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
  /api/runs/{id}/usage:
    get:
      summary: Get token and USD usage for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run usage
  /api/runs/{id}/followups:
    post:
      summary: Start a follow-up run in the same session
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Follow-up accepted
  /api/runs/{id}/cancel:
    post:
      summary: Cancel a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Cancelled run
  /api/runs/{id}/events:
    get:
      summary: List persisted events
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Event list
  /api/runs/{id}/events/stream:
    get:
      summary: Stream run events over SSE
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: text/event-stream
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateRun:
      type: object
      required: [repository_id, agent_profile_id, prompt]
      properties:
        repository_id:
          type: string
          format: uuid
        agent_profile_id:
          type: string
          format: uuid
        prompt:
          type: string
        base_branch:
          type: string
        trigger:
          type: string
        auto_pr:
          type: boolean
          default: true
        environment:
          type: string
          enum: [local, docker]
        timeout_seconds:
          type: integer
          minimum: 1
        max_turns:
          type: integer
          minimum: 1
