services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentyard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentyard"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - agentyard-db:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIX_ENV: dev
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentyard
      SECRET_KEY_BASE: dev-only-secret-key-base-change-for-production-please-0123456789
      AGENTYARD_SECRET_KEY: dev-only-encryption-key-change-for-production
      DEMO_MODE: "true"
      PHX_HOST: localhost
      PORT: "4000"
    ports:
      - "4000:4000"

volumes:
  agentyard-db:
