name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          build-args: |
            MIX_ENV=prod
          tags: |
            ghcr.io/dominicletz/agentyard:${{ github.sha }}
            ghcr.io/dominicletz/agentyard:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (best effort)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # packages: write permits publishing, but not changing package visibility.
          if ! curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data '{"visibility":"public"}' \
              "${{ github.api_url }}/user/packages/container/agentyard"; then
            echo "::warning::GitHub could not change GHCR package visibility with GITHUB_TOKEN (the API currently returns 404). Set agentyard to Public once in Package settings; see the production deploy instructions in README.md."
          fi
